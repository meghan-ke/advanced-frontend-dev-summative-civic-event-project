<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New announcement · Civic Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen flex-col bg-navy font-sans text-ink">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 rounded bg-white px-3 py-2 text-burgundy">Skip to content</a>
  <div id="navbar"></div>

  <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-3 sm:px-6">
    <div class="mb-6">
      <h1 class="font-display text-5xl uppercase text-cream-text">New announcement</h1>
      <p class="mt-2 text-cream-text">Share an audio update with your community.</p>
    </div>
    <section class="panel max-w-2xl">
      <form id="ann-form" novalidate class="space-y-5">
        <div id="form-alert" role="alert" class="hidden rounded-lg border border-red-700 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
        <div><label for="title" class="mb-1 block text-sm font-medium">Title</label><input id="title" class="input" required maxlength="255"></div>
        <div>
          <label for="audio" class="mb-1 block text-sm font-medium">Audio file (MP3, WAV, M4A or OGG, up to 15 MB)</label>
          <input id="audio" type="file" accept=".mp3,.wav,.m4a,.ogg,audio/mpeg,audio/wav,audio/mp4,audio/ogg" class="block w-full text-sm file:mr-3 file:rounded-full file:border-0 file:bg-burgundy file:px-4 file:py-2 file:text-white" required>
          <audio id="preview" controls preload="metadata" class="mt-3 hidden w-full" aria-label="Preview of the selected audio"></audio>
        </div>
        <label class="flex items-center gap-2 text-sm"><input id="published" type="checkbox" checked class="h-4 w-4 accent-burgundy"> Publish immediately</label>
        <div id="progress-wrap" class="hidden" aria-live="polite">
          <div class="h-2 rounded bg-line"><div id="progress" class="h-2 rounded bg-burgundy" style="width:0%"></div></div>
          <p id="progress-text" class="mt-1 text-sm text-ink-soft">Uploading 0%</p>
        </div>
        <div class="sticky bottom-0 -mx-6 flex gap-3 border-t border-line bg-cream px-6 py-4 sm:-mx-10 sm:px-10">
          <button id="save" type="submit" class="btn-primary">Upload announcement</button>
          <a href="list.html" class="btn-outline">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../js/core/config.js"></script>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/core/utils.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/guard.js"></script>
  <script src="../../js/core/ui.js"></script>
  <script src="../../js/components/navbar.js"></script>
  <script src="../../js/components/footer.js"></script>
  <script src="../../js/components/notification-drawer.js"></script>
  <script src="../../js/page-scripts/announcement-form.js"></script>
</body>
</html>
