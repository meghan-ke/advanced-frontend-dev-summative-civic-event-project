<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · Civic Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/output.css">
</head>
<body class="flex min-h-screen flex-col bg-navy font-sans text-ink">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 rounded bg-white px-3 py-2 text-burgundy">Skip to content</a>
  <div id="navbar"></div>

  <main id="main" class="mx-auto w-full max-w-4xl flex-1 px-3 sm:px-6">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-5xl uppercase text-cream-text">Notifications</h1>
        <p id="unread-count" class="mt-2 text-sm text-cream-text" aria-live="polite"></p>
      </div>
      <button id="mark-all-read" type="button" class="btn-outline">Mark all as read</button>
    </div>
    <section class="panel" aria-label="Your notifications">
      <div id="inbox" aria-live="polite"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/guard.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/components/notification-drawer.js"></script>
  <script src="../js/components/notification-inbox.js"></script>
  <script src="../js/page-scripts/notifications.js"></script>
</body>
</html>
