<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Civic Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="min-h-screen bg-navy font-sans text-ink">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-white text-burgundy px-3 py-2 rounded">Skip to content</a>

  <header class="px-6 py-6">
    <a href="../../index.html" class="font-display text-3xl tracking-widest text-cream-text">CIVIC</a>
  </header>

  <main id="main" class="px-4 pb-12">
    <section class="mx-auto max-w-md bg-cream rounded-3xl shadow-2xl p-8 sm:p-10" aria-labelledby="title">
      <h1 id="title" class="font-display text-4xl uppercase text-burgundy pb-4 mb-6 border-b border-burgundy">Create account</h1>

      <form id="signup-form" novalidate class="space-y-5">
        <div id="form-alert" role="alert" class="hidden rounded-lg bg-red-50 border border-red-700 text-red-700 px-4 py-3 text-sm"></div>

        <div>
          <label for="full_name" class="block text-sm font-medium mb-1">Full name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" class="input" required>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium mb-1">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" class="input" required>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-1">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" class="input" required aria-describedby="meter-label rules">

          <div id="meter" class="mt-2 flex gap-1" aria-hidden="true">
            <div class="seg h-1.5 flex-1 rounded bg-line"></div>
            <div class="seg h-1.5 flex-1 rounded bg-line"></div>
            <div class="seg h-1.5 flex-1 rounded bg-line"></div>
            <div class="seg h-1.5 flex-1 rounded bg-line"></div>
          </div>
          <p id="meter-label" class="mt-1 text-sm text-ink-soft" aria-live="polite">Password strength: —</p>

          <ul id="rules" class="mt-2 grid gap-1 text-sm text-ink-soft">
            <li data-rule="len"><span class="mark" aria-hidden="true">○</span> At least 8 characters<span class="sr-only status"> not met</span></li>
            <li data-rule="case"><span class="mark" aria-hidden="true">○</span> Upper and lower case letters<span class="sr-only status"> not met</span></li>
            <li data-rule="num"><span class="mark" aria-hidden="true">○</span> A number<span class="sr-only status"> not met</span></li>
            <li data-rule="sym"><span class="mark" aria-hidden="true">○</span> A special character<span class="sr-only status"> not met</span></li>
          </ul>
        </div>

        <div>
          <label for="confirm_password" class="block text-sm font-medium mb-1">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" class="input" required>
        </div>

        <button id="submit" type="submit" class="btn-primary w-full">Create account</button>
      </form>

      <p class="mt-6 text-sm text-ink-soft">
        Already have an account? <a href="login.html" class="text-burgundy font-semibold underline">Log in</a>
      </p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../js/core/config.js"></script>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/core/utils.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/guard.js"></script>
  <script src="../../js/core/ui.js"></script>
  <script src="../../js/page-scripts/signup.js"></script>
</body>
</html>
