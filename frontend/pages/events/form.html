<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event form · Civic Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/output.css">
</head>
<body class="flex min-h-screen flex-col bg-navy font-sans text-ink">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 rounded bg-white px-3 py-2 text-burgundy">Skip to content</a>
  <div id="navbar"></div>

  <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-3 sm:px-6">
    <h1 id="form-title" class="mb-6 font-display text-5xl uppercase text-cream-text">New event</h1>
    <section class="panel max-w-3xl">
      <form id="event-form" novalidate class="space-y-5">
        <div id="form-alert" role="alert" class="hidden rounded-lg border border-red-700 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

        <div><label for="title" class="mb-1 block text-sm font-medium">Title</label><input id="title" class="input" required></div>
        <div><label for="description" class="mb-1 block text-sm font-medium">Description</label><textarea id="description" rows="5" class="input h-auto py-2" required></textarea></div>
        <div><label for="location" class="mb-1 block text-sm font-medium">Location</label><input id="location" class="input" required></div>
        <div class="grid gap-5 sm:grid-cols-2">
          <div><label for="starts_at" class="mb-1 block text-sm font-medium">Starts</label><input id="starts_at" type="datetime-local" class="input" required></div>
          <div><label for="ends_at" class="mb-1 block text-sm font-medium">Ends</label><input id="ends_at" type="datetime-local" class="input" required></div>
        </div>

        <div>
          <label for="image" class="mb-1 block text-sm font-medium">Event image (JPG, PNG or WebP, up to 5 MB)</label>
          <input id="image" type="file" accept="image/jpeg,image/png,image/webp" class="block w-full text-sm file:mr-3 file:rounded-full file:border-0 file:bg-burgundy file:px-4 file:py-2 file:text-white">
          <img id="preview" alt="Preview of the selected event image" class="mt-3 hidden max-h-56 rounded-xl object-cover">
        </div>

        <div id="progress-wrap" class="hidden" aria-live="polite">
          <div class="h-2 rounded bg-line"><div id="progress" class="h-2 rounded bg-burgundy" style="width:0%"></div></div>
          <p id="progress-text" class="mt-1 text-sm text-ink-soft">Uploading 0%</p>
        </div>

        <div class="sticky bottom-0 -mx-6 flex gap-3 border-t border-line bg-cream px-6 py-4 sm:-mx-10 sm:px-10">
          <button id="save" type="submit" class="btn-primary">Save event</button>
          <a href="list.html" class="btn-outline">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../js/core/config.js"></script>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/core/utils.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/guard.js"></script>
  <script src="../../js/core/ui.js"></script>
  <script src="../../js/components/navbar.js"></script>
  <script src="../../js/components/footer.js"></script>
  <script src="../../js/components/notification-drawer.js"></script>
  <script src="../../js/page-scripts/event-form.js"></script>
</body>
</html>
