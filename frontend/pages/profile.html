<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile · Civic Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/output.css">
</head>
<body class="flex min-h-screen flex-col bg-navy font-sans text-ink">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 rounded bg-white px-3 py-2 text-burgundy">Skip to content</a>
  <div id="navbar"></div>

  <main id="main" class="mx-auto w-full max-w-4xl flex-1 px-3 sm:px-6">
    <div class="mb-6">
      <h1 class="font-display text-5xl uppercase text-cream-text">My profile</h1>
      <p class="mt-2 text-cream-text">Manage your contact details and view your account status.</p>
    </div>
    <section class="panel">
      <div id="profile-loading" class="animate-pulse space-y-4" aria-live="polite">
        <div class="h-6 w-1/3 rounded bg-line"></div>
        <div class="h-4 w-1/2 rounded bg-line"></div>
      </div>
      <div id="profile-content" class="hidden">
        <dl class="mb-8 grid gap-4 border-b border-line pb-6 sm:grid-cols-2">
          <div><dt class="text-sm font-semibold text-ink-soft">Role</dt><dd id="profile-role" class="mt-1 font-medium"></dd></div>
          <div><dt class="text-sm font-semibold text-ink-soft">Account status</dt><dd id="profile-status" class="mt-1 font-medium"></dd></div>
          <div><dt class="text-sm font-semibold text-ink-soft">Member since</dt><dd id="profile-created" class="mt-1 font-medium"></dd></div>
        </dl>

        <form id="profile-form" novalidate class="max-w-2xl space-y-5">
          <div id="form-alert" role="alert" class="hidden rounded-lg border border-red-700 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
          <div>
            <label for="full-name" class="mb-1 block text-sm font-medium">Full name</label>
            <input id="full-name" name="full_name" type="text" autocomplete="name" class="input" required maxlength="255">
          </div>
          <div>
            <label for="email" class="mb-1 block text-sm font-medium">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" class="input" required>
          </div>
          <p class="text-sm text-ink-soft">Role and account status can’t be changed from your profile.</p>
          <button id="save-profile" type="submit" class="btn-primary">Save changes</button>
        </form>
      </div>
      <div id="profile-error" class="hidden" role="alert"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/guard.js"></script>
  <script src="../js/core/ui.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/components/notification-drawer.js"></script>
  <script src="../js/page-scripts/profile.js"></script>
</body>
</html>
